# https://clearscale.conde.cloud, signing in against its Keycloak realm. The file name is the workspace name;
# everything else the chart needs is derived from it in deploy/argocd/workspaces.yaml.tftpl, and only these keys
# (boardName, oidc, invite, and optionally replicas) are read from here.
boardName: clearscale
oidc:
  issuer: https://auth.conde.cloud/realms/clearscale
  clientId: conde
# How an invite reaches the person: one email from the server (docs/DEPLOY.md, invites).
invite:
  signIn: google
