name: ci

# Pull requests and main: Rust format, lints and tests (Postgres backend included), the web app's
# checks, and every Terraform root under infra/gcp formatted and valid without cloud access.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_TERM_COLOR: never

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check

  rust:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          # a throwaway server reachable only from this job
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # key=value form: the suites append dbname=<fresh database>
      CONDE_TEST_PG: host=localhost port=5432 user=postgres
      # the debug test binaries with debug info fill the runner's disk at link time (ld: Bus error)
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # the server embeds the web build; the web tests check what it serves
      - name: Web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm test
          npm run build
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The Windows port: the workspace tests on SQLite (no Postgres service on this runner, so the
  # Postgres cases skip as they do without CONDE_TEST_PG).
  windows:
    runs-on: windows-2025
    env:
      # no Postgres service on this runner: the Postgres cases skip, and say so
      CONDE_TEST_NO_PG: "1"
      # a disposable machine: the login test's setup may register the real scheduled task conde
      CONDE_TEST_SCHEDULED_TASK: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web app
        working-directory: web
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        shell: bash
        run: cargo test --workspace --locked --no-fail-fast

  # The Windows release binary, built as release.yml builds it, installed by dist/install.ps1 from a
  # local copy of the bucket layout, then run as a new user would run it.
  windows-install:
    runs-on: windows-2025
    env:
      TARGET: x86_64-pc-windows-msvc
      NAME: conde-windows-x86_64.exe
      # the VC++ runtime DLL is not on every Windows machine: link the C runtime statically
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        shell: bash
        run: cargo build --release --locked -p conde --target "$TARGET"
      - name: Bucket layout, served on 127.0.0.1:8765
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/conde/Cargo.toml | head -n 1)
          root="$RUNNER_TEMP/bucket"
          mkdir -p "$root/v$version"
          cp "target/$TARGET/release/conde.exe" "$root/v$version/$NAME"
          (cd "$root/v$version" && sha256sum "$NAME" > SHA256SUMS)
          echo "v$version" > "$root/latest"
          cp dist/install.ps1 "$root/install.ps1"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # the bucket serves install.ps1 and latest as text, as the release uploads them
          cat > "$RUNNER_TEMP/serve.py" <<'PY'
          import functools, http.server, sys
          H = http.server.SimpleHTTPRequestHandler
          H.extensions_map.update({".ps1": "text/plain; charset=utf-8", "": "text/plain; charset=utf-8"})
          http.server.test(HandlerClass=functools.partial(H, directory=sys.argv[1]), port=8765, bind="127.0.0.1")
          PY
          nohup python "$RUNNER_TEMP/serve.py" "$root" > "$RUNNER_TEMP/serve.log" 2>&1 &
          for _ in $(seq 50); do curl -fsS http://127.0.0.1:8765/latest && break; sleep 0.2; done
      - name: Install with Windows PowerShell 5.1, upgrade with PowerShell 7
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'conde\bin'
          $run = 'irm http://127.0.0.1:8765/install.ps1 | iex'
          $env:CONDE_DIST_BASE_URL = 'http://127.0.0.1:8765'
          $out = powershell -NoProfile -Command $run | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed: $LASTEXITCODE" }
          foreach ($want in @("installed $dir\conde.exe (conde $env:VERSION ", 'Next:', 'conde login --server https://<workspace>.conde.cloud', "added $dir to your user PATH")) {
            if (-not $out.Contains($want)) { throw "install.ps1 did not print: $want" }
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not (($userPath -split ';') -contains $dir)) { throw "user PATH lacks ${dir}: $userPath" }
          $up = pwsh -NoProfile -Command $run | Out-String
          Write-Host $up
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 upgrade failed: $LASTEXITCODE" }
          foreach ($want in @("replaced $dir\conde.exe (conde $env:VERSION ", 'Next (an upgrade;', 'conde setup')) {
            if (-not $up.Contains($want)) { throw "install.ps1 upgrade did not print: $want" }
          }
          if ($up.Contains('conde login')) { throw 'the upgrade names the sign-in' }
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Run the installed conde
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'conde\bin'
          if ((Get-Command conde).Source -ne "$dir\conde.exe") { throw "conde resolves to $((Get-Command conde).Source)" }
          $v = conde --version
          Write-Host $v
          if (-not "$v".StartsWith("conde $env:VERSION (")) { throw "version: $v" }
          Write-Host '--- conde setup --check'
          $check = conde setup --check 2>&1 | Out-String
          Write-Host $check
          Write-Host "--- exit status $LASTEXITCODE"
          if (-not $check.Contains("conde $env:VERSION")) { throw 'setup --check did not run' }
          Write-Host '--- conde doctor'
          $doctor = conde doctor 2>&1 | Out-String
          Write-Host $doctor
          Write-Host "--- exit status $LASTEXITCODE"
          $global:LASTEXITCODE = 0
      # the real Task Scheduler: setup registers the task conde and starts the bridge on the pipe
      - name: conde setup, then setup --check and doctor all clear
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:LOCALAPPDATA 'conde\data\conde.log'
          try {
            Write-Host '--- conde setup'
            conde setup 2>&1 | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "conde setup: exit status $LASTEXITCODE" }
            schtasks /Query /TN conde | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'no scheduled task conde' }
            $pipe = '\\.\pipe\conde-' + ($env:USERNAME.ToLowerInvariant() -replace '[^a-z0-9._-]', '-')
            # the task starts the bridge; it answers on the pipe a moment later
            for ($i = 0; $i -lt 60; $i++) {
              conde doctor *> $null
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Milliseconds 500
            }
            Write-Host '--- conde setup --check'
            $check = conde setup --check 2>&1 | Out-String
            Write-Host $check
            if ($LASTEXITCODE -ne 0) { throw "setup --check: exit status $LASTEXITCODE" }
            foreach ($want in @("service: the bridge answers on $pipe", "service: the bridge runs this build ($env:VERSION", 'all clear')) {
              if (-not $check.Contains($want)) { throw "setup --check did not print: $want" }
            }
            Write-Host '--- conde doctor'
            $doctor = conde doctor 2>&1 | Out-String
            Write-Host $doctor
            if ($LASTEXITCODE -ne 0) { throw "doctor: exit status $LASTEXITCODE" }
            foreach ($want in @("ok      daemon: reachable at $pipe", "ok      bridge: running this build ($env:VERSION", 'all clear')) {
              if (-not $doctor.Contains($want)) { throw "doctor did not print: $want" }
            }
            # a bare runner: no harness above this shell, so it acts as the human
            conde register ci.smoke | Out-Host
            if ($LASTEXITCODE -ne 0) { throw 'register failed' }
            $user = $env:USERNAME.ToLowerInvariant()
            $who = ((conde whoami) | Select-Object -First 1).Split(' ')[0]
            if ($who -ne "$user/ci.smoke") { throw "whoami: $who" }
            $env:CONDE_DIST_BASE_URL = 'http://127.0.0.1:8765'
            $update = conde update --check 2>&1 | Out-String
            Write-Host $update
            if (-not $update.Contains("conde $env:VERSION is current")) { throw "update --check: $update" }
            # an upgrade while the bridge runs conde.exe: the locked binary moves aside, the bridge keeps answering
            $up = pwsh -NoProfile -Command 'irm http://127.0.0.1:8765/install.ps1 | iex' | Out-String
            Write-Host $up
            if (-not $up.Contains('replaced ')) { throw "install.ps1 over a running bridge: $up" }
            $dir = Join-Path $env:LOCALAPPDATA 'conde\bin'
            Get-ChildItem $dir | Out-Host
            conde doctor | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "doctor after the upgrade: exit status $LASTEXITCODE" }
          } finally {
            Write-Host "--- $log"
            Get-Content -Tail 100 $log -ErrorAction SilentlyContinue | Out-Host
            schtasks /End /TN conde 2>&1 | Out-Null
            schtasks /Delete /TN conde /F 2>&1 | Out-Null
            $global:LASTEXITCODE = 0
          }

      # The newcomer's path on Windows: `conde login` in code mode on a workspace (a real `conde server`
      # behind a stand-in sign-in page), which sets the machine up with the real scheduled task; then
      # the bridge connects to the workspace, doctor is all clear, and the MCP entry login wrote answers.
      - name: conde login on a workspace, the bridge, doctor and the MCP server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-Command conde).Source
          $srv = Join-Path $env:RUNNER_TEMP 'workspace'
          $log = Join-Path $env:LOCALAPPDATA 'conde\data\conde.log'
          $key = "$(conde admin key create --user krisztian --host ci-win --label ci --data $srv)".Trim()
          if (-not $key.StartsWith('conde_')) { throw "no host key: $key" }
          $env:CONDE_BOARD_NAME = 'vvp'
          $server = Start-Process $exe -ArgumentList 'server', '--listen', '127.0.0.1:8770', '--data', $srv -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\server.out" -RedirectStandardError "$env:RUNNER_TEMP\server.log"
          $front = Start-Process python -ArgumentList '.github/scripts/signin-front.py', '8771', '8770', $key, 'krisztian' -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\front.out" -RedirectStandardError "$env:RUNNER_TEMP\front.log"
          $mcp = $null
          try {
            for ($i = 0; $i -lt 50; $i++) {
              try { Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8771/healthz' | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
            }
            # Claude Code's config directory exists, so login writes its MCP entry
            New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.claude') | Out-Null
            $ws = 'http://127.0.0.1:8771'
            $first = conde login --server $ws --host ci-win --no-browser 2>&1 | Out-String
            Write-Host $first
            if ($LASTEXITCODE -ne 3) { throw "login without a code: exit status $LASTEXITCODE" }
            $url = [regex]::Match($first, 'http://127\.0\.0\.1:8771/auth/cli\?mode=code\S*').Value
            $page = (Invoke-WebRequest -UseBasicParsing -Uri $url).Content
            $code = [regex]::Match($page, '<pre id="key">([^<]+)<').Groups[1].Value
            $out = conde login --server $ws --host ci-win --code $code 2>&1 | Out-String
            Write-Host $out
            if ($LASTEXITCODE -ne 0) { throw "login with the code: exit status $LASTEXITCODE" }
            foreach ($want in @('signed in as krisztian', 'as board vvp (account krisztian)', 'service: registered the scheduled task conde', 'claude: ')) {
              if (-not $out.Contains($want)) { throw "login did not print: $want" }
            }
            if ($out.Contains('FAILED')) { throw 'a setup part FAILED' }
            $doctor = ''
            for ($i = 0; $i -lt 60; $i++) {
              $doctor = conde doctor 2>&1 | Out-String
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Milliseconds 500
            }
            Write-Host $doctor
            if ($LASTEXITCODE -ne 0 -or -not $doctor.Contains('all clear')) { throw 'doctor is not all clear after login' }
            $boards = conde boards | Out-String
            Write-Host $boards
            if (-not ($boards -match 'vvp\t.*connected')) { throw "the bridge is not connected to the workspace: $boards" }

            # the MCP server as Claude Code starts it, from the entry login wrote
            $entry = (Get-Content -Raw (Join-Path $env:USERPROFILE '.claude.json') | ConvertFrom-Json).mcpServers.conde
            Write-Host "MCP entry: $($entry | ConvertTo-Json -Compress)"
            $psi = [Diagnostics.ProcessStartInfo]::new($entry.command)
            foreach ($a in $entry.args) { $psi.ArgumentList.Add($a) }
            if ($entry.env) { foreach ($p in $entry.env.PSObject.Properties) { $psi.Environment[$p.Name] = $p.Value } }
            $psi.UseShellExecute = $false
            $psi.RedirectStandardInput = $true
            $psi.RedirectStandardOutput = $true
            $mcp = [Diagnostics.Process]::Start($psi)
            $ask = {
              param($msg)
              $mcp.StandardInput.WriteLine(($msg | ConvertTo-Json -Compress -Depth 10))
              $mcp.StandardInput.Flush()
              if (-not $msg.ContainsKey('id')) { return $null }
              $line = $mcp.StandardOutput.ReadLineAsync()
              if (-not $line.Wait(15000)) { throw "no MCP answer to $($msg.method)" }
              Write-Host $line.Result
              $line.Result | ConvertFrom-Json
            }
            $init = & $ask @{ jsonrpc = '2.0'; id = 1; method = 'initialize'; params = @{ protocolVersion = '2025-06-18'; capabilities = @{}; clientInfo = @{ name = 'claude-code'; version = '0' } } }
            if ($init.result.serverInfo.name -ne 'conde') { throw 'initialize: not the conde server' }
            & $ask @{ jsonrpc = '2.0'; method = 'notifications/initialized' } | Out-Null
            $tools = & $ask @{ jsonrpc = '2.0'; id = 2; method = 'tools/list'; params = @{} }
            if (-not ($tools.result.tools.name -contains 'whoami')) { throw 'tools/list has no whoami' }
            $who = & $ask @{ jsonrpc = '2.0'; id = 3; method = 'tools/call'; params = @{ name = 'whoami'; arguments = @{} } }
            if (-not $who.result.content[0].text) { throw 'whoami gave no answer' }
          } finally {
            if ($mcp) { $mcp.StandardInput.Close(); if (-not $mcp.WaitForExit(5000)) { $mcp.Kill() } }
            foreach ($f in @("$env:RUNNER_TEMP\server.log", "$env:RUNNER_TEMP\front.log", $log)) {
              Write-Host "--- $f"
              Get-Content -Tail 60 $f -ErrorAction SilentlyContinue | Out-Host
            }
            Stop-Process -Id $front.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            schtasks /End /TN conde 2>&1 | Out-Null
            schtasks /Delete /TN conde /F 2>&1 | Out-Null
            $global:LASTEXITCODE = 0
          }

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.3"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/gcp
      - name: Validate every root
        run: |
          for root in infra/gcp/*/; do
            [ "$root" = infra/gcp/modules/ ] && continue
            echo "--- $root"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
