# conde's sign-in pages in design B (web/src/app.css): keycloak.v2's templates and PatternFly, restyled by css/conde.css.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/conde.css

# Dark only: the dark PatternFly class is always on, so keycloak.v2's prefers-color-scheme switch is off.
darkMode=false
kcHtmlClass=login-pf pf-v5-theme-dark

favicons.light=img/favicon-light-32.png
favicons.light.type=image/png
favicons.light.media=(prefers-color-scheme: light)
favicons.dark=img/favicon-dark-32.png
favicons.dark.type=image/png
favicons.dark.media=(prefers-color-scheme: dark)
favicons.svg=img/favicon.svg
favicons.svg.type=image/svg+xml
favicons.order=light dark svg
