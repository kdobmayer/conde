# conde's account console in design B (web/src/app.css): keycloak.v3's React app and PatternFly, restyled by css/conde.css.
parent=keycloak.v3
import=common/keycloak

styles=css/conde.css
scripts=js/conde.js

# Dark only, as the sign-in pages: js/conde.js sets the dark PatternFly class, so keycloak.v3's prefers-color-scheme switch is off.
darkMode=false

# The masthead's brand image is the mark; css/conde.css sets the wordmark beside it.
logo=/img/mark.svg
title=conde account

favicons.light=img/favicon-light-32.png
favicons.light.type=image/png
favicons.light.media=(prefers-color-scheme: light)
favicons.dark=img/favicon-dark-32.png
favicons.dark.type=image/png
favicons.dark.media=(prefers-color-scheme: dark)
favicons.svg=img/favicon.svg
favicons.svg.type=image/svg+xml
favicons.order=light dark svg
