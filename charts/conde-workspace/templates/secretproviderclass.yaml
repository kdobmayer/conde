{{- if .Values.gcp.enabled }}
{{- $p := required "gcp.project is required" .Values.gcp.project }}
{{- $s := .Values.gcp.secrets }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: conde
  namespace: {{ .Release.Namespace }}
spec:
  provider: gke
  parameters:
    secrets: |
      - "path": "admin-key"
        "resourceName": "projects/{{ $p }}/secrets/{{ required "gcp.secrets.adminKey is required" $s.adminKey }}/versions/latest"
      - "path": "oidc-client-secret"
        "resourceName": "projects/{{ $p }}/secrets/{{ required "gcp.secrets.oidcClientSecret is required" $s.oidcClientSecret }}/versions/latest"
      - "path": "slack-bot-token"
        "resourceName": "projects/{{ $p }}/secrets/{{ required "gcp.secrets.slackBotToken is required" $s.slackBotToken }}/versions/latest"
      {{- with $s.resendApiKey }}
      - "path": "resend-api-key"
        "resourceName": "projects/{{ $p }}/secrets/{{ . }}/versions/latest"
      {{- end }}
      {{- if eq $.Values.invite.signIn "password" }}
      - "path": "keycloak-admin-client-secret"
        "resourceName": "projects/{{ $p }}/secrets/{{ required "gcp.secrets.keycloakAdminClientSecret is required" $s.keycloakAdminClientSecret }}/versions/latest"
      {{- end }}
{{- end }}
