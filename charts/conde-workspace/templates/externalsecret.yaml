{{- if and (not .Values.gcp.enabled) .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "conde.envSecretName" . }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecret.secretStoreRef.name is required" .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "conde.envSecretName" . }}
  data:
    {{- range $env, $key := .Values.externalSecret.data }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ $key }}
    {{- end }}
{{- end }}
