# One-off dump of conde_dakai for the move back to Azure (docs/CUTOVER-dakai-azure.md), the mirror of
# dakai-restore.yaml: same service account, admin secret and Cloud SQL Auth Proxy sidecar. Read only on the database:
# a psql session holds a repeatable-read snapshot as the workspace's IAM user, pg_dump shares it, and counts.sql runs
# in it after the dump, so the .counts file describes exactly the dumped data. counts.sql comes from the ConfigMap
# cutover-counts (created from infra/cutover/counts.sql). The Job waits for /work/copied so the files can be copied
# out. Not part of the chart; Argo CD does not manage it. Delete the Job and the ConfigMap after the move.
apiVersion: batch/v1
kind: Job
metadata:
  name: dump
  namespace: ws-dakai
  labels:
    app.kubernetes.io/name: dump
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dump
    spec:
      serviceAccountName: dbinit
      restartPolicy: Never
      tolerations:
      - effect: NoSchedule
        key: kubernetes.io/arch
        operator: Equal
        value: amd64
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: cloud-sql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.3@sha256:f333a9c59890c3c67b8505166c5dbdcc0b29fca9173a2e09ca0446ab6997a736
        restartPolicy: Always
        args:
        - --psc
        - --structured-logs
        - --address=127.0.0.1
        - --port=5432
        - --health-check
        - --http-address=0.0.0.0
        - --http-port=9090
        - conde-prod:europe-west3:conde-pg
        startupProbe:
          httpGet:
            path: /startup
            port: 9090
          periodSeconds: 2
          failureThreshold: 60
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 100Mi
          limits:
            ephemeral-storage: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      containers:
      - name: dump
        image: docker.io/library/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        command:
        - /bin/sh
        - -c
        args:
        - |
          set -eu -o pipefail
          PGPASSWORD=$(cat /secrets/pg-admin-password)
          export PGPASSWORD PGHOST=127.0.0.1 PGUSER=postgres PGDATABASE="$DB"
          cd /work
          n=conde-gcp-$(date -u +%Y%m%dT%H%M%SZ).dump
          mkfifo /tmp/q
          psql -X -q -At -v ON_ERROR_STOP=1 </tmp/q >/tmp/r 2>&1 &
          p=$!
          exec 3>/tmp/q
          # SET ROLE: the tables belong to the IAM user; dbinit makes postgres a member.
          printf '%s\n' "SET ROLE \"$ROLE\";" 'BEGIN ISOLATION LEVEL REPEATABLE READ, READ ONLY;' 'SELECT pg_export_snapshot();' >&3
          i=0
          until snap=$(grep -m1 -E '^[0-9A-F]+-[0-9A-F]+-[0-9]+$' /tmp/r); do
            i=$((i + 1)); [ "$i" -lt 60 ] || { cat /tmp/r; exit 1; }; sleep 1
          done
          echo "snapshot $snap"
          s=$(date +%s)
          pg_dump --role="$ROLE" --snapshot="$snap" -Fc --no-owner --no-acl -f "$n.part"
          cat /cutover/counts.sql >&3
          printf '%s\n' 'COMMIT;' >&3
          exec 3>&-
          wait "$p"
          grep -v -x "$snap" /tmp/r >"$n.counts"
          mv "$n.part" "$n"
          echo "dump seconds $(($(date +%s) - s))"
          sed 's/^/COUNT /' "$n.counts"
          pg_dump --version
          psql -X -q -At -v ON_ERROR_STOP=1 \
            -c "SELECT 'server_version|' || current_setting('server_version')" \
            -c "SELECT 'extension|' || extname || '|' || extversion FROM pg_extension ORDER BY extname"
          sha256sum "$n" | tee "$n.sha256"
          ls -l /work
          echo "dump done $n"
          until [ -f /work/copied ]; do sleep 2; done
        env:
        - name: ROLE
          value: conde-dakai@conde-prod.iam
        - name: DB
          value: conde_dakai
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 1Gi
          limits:
            ephemeral-storage: 1Gi
        securityContext:
          runAsUser: 70
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: secrets
          mountPath: /secrets
          readOnly: true
        - name: counts
          mountPath: /cutover
          readOnly: true
        - name: work
          mountPath: /work
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: secrets
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: dbinit
      - name: counts
        configMap:
          name: cutover-counts
      - name: work
        emptyDir:
          sizeLimit: 900Mi
      - name: tmp
        emptyDir: {}
  activeDeadlineSeconds: 3600
