name: release

# Static Linux, macOS and Windows binaries with a SHA256SUMS file, published to the public
# `dist` blob container that https://conde.nativeai.space/dist/* redirects to.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_TERM_COLOR: never

jobs:
  # The web app the server image embeds (the Dockerfile builds it the same way): type check,
  # build, and the static files as an artifact.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: conde-web
          path: crates/conde-remote/web-dist/
          if-no-files-found: error

  macos:
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: conde-darwin-arm64
          - target: x86_64-apple-darwin
            name: conde-darwin-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: cargo build --release --locked -p conde --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/conde out/${{ matrix.name }}
          file out/${{ matrix.name }}
          (cd out && shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256)
      - name: Smoke test (native target only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: out/${{ matrix.name }} --version
      - name: Identity probe (libproc ancestry walk, native target only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -eu
          bin="$PWD/out/${{ matrix.name }}"
          tmp=$(mktemp -d)
          export CONDE_SOCK="$tmp/run/conde.sock" CONDE_DATA="$tmp/data"
          "$bin" daemon >"$tmp/daemon.log" 2>&1 &
          daemon=$!
          dump() {
            rc=$?
            set +e
            if [ "$rc" != 0 ]; then
              echo "--- daemon log ($tmp/daemon.log)"
              cat "$tmp/daemon.log"
              if kill -0 "$daemon" 2>/dev/null; then
                echo "--- daemon still running"
              else
                wait "$daemon"
                echo "--- daemon exit status: $?"
              fi
            fi
            kill "$daemon" 2>/dev/null
            exit "$rc"
          }
          trap dump EXIT
          for _ in $(seq 1 100); do [ -S "$CONDE_SOCK" ] && break; sleep 0.1; done
          echo "--- conde doctor"
          "$bin" doctor || echo "--- doctor exit status: $?"
          user=$(printf '%s' "$USER" | tr '[:upper:]' '[:lower:]')
          # a bare runner: the walk finds no harness, so this shell acts as the human
          "$bin" register ci.smoke
          test "$("$bin" whoami | head -1 | cut -d" " -f1)" = "$user/ci.smoke"
          case $("$bin" resolve ci.smoke) in
            "human:$user@"*) ;;
            *) echo "ci.smoke does not resolve to the human"; exit 1 ;;
          esac
          # without session markers under a process named claude it must refuse;
          # /bin/sh on macOS execs another shell and would lose the name, so copy bash
          cp /bin/bash "$tmp/claude"
          # shellcheck disable=SC2016 # the inner shell expands $0 and $?
          if out=$("$tmp/claude" -c '"$0" whoami; rc=$?; exit $rc' "$bin" 2>&1); then
            echo "whoami succeeded under claude: $out"
            exit 1
          fi
          case $out in
            *"no session markers, but this process runs under a claude agent"*) echo "refused as expected: $out" ;;
            *) echo "unexpected output: $out"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: conde-linux-x86_64
          - target: aarch64-unknown-linux-musl
            name: conde-linux-aarch64
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: cargo-zigbuild
        # zig cross-compiles the bundled SQLite C code for both musl targets
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install cargo-zigbuild==0.23.4 ziglang==0.17.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo zigbuild --release --locked -p conde --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/conde out/${{ matrix.name }}
          file out/${{ matrix.name }}
          (cd out && sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256)
      - name: Smoke test (native target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: out/${{ matrix.name }} --version
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      NAME: conde-windows-x86_64.exe
      # the VC++ runtime DLL is not on every Windows machine: link the C runtime statically
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        shell: bash
        run: cargo build --release --locked -p conde --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          mkdir out
          cp "target/$TARGET/release/conde.exe" "out/$NAME"
          (cd out && sha256sum "$NAME" > "$NAME.sha256")
      - name: Smoke test
        shell: pwsh
        run: |
          & "out/$env:NAME" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Identity probe (named pipe, Toolhelp ancestry walk)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = (Resolve-Path "out/$env:NAME").Path
          $tmp = Join-Path $env:RUNNER_TEMP 'conde-probe'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $env:CONDE_DATA = "$tmp\data"
          $env:CONDE_SOCK = '\\.\pipe\conde-ci-probe'
          $daemon = Start-Process -FilePath $bin -ArgumentList 'daemon' -PassThru -NoNewWindow `
            -RedirectStandardOutput "$tmp\daemon.out" -RedirectStandardError "$tmp\daemon.log"
          $ok = $false
          try {
            for ($i = 0; $i -lt 100; $i++) {
              if ([IO.Directory]::GetFiles('\\.\pipe\') -contains $env:CONDE_SOCK) { break }
              Start-Sleep -Milliseconds 100
            }
            Write-Host '--- conde doctor'
            & $bin doctor
            Write-Host "--- doctor exit status: $LASTEXITCODE"
            $user = $env:USERNAME.ToLowerInvariant()
            # a bare runner: the walk finds no harness, so this shell acts as the human
            & $bin register ci.smoke
            if ($LASTEXITCODE -ne 0) { throw 'register failed' }
            $who = ((& $bin whoami) | Select-Object -First 1).Split(' ')[0]
            if ($who -ne "$user/ci.smoke") { throw "whoami: $who" }
            $resolved = "$(& $bin resolve ci.smoke)"
            if (-not $resolved.StartsWith("human:$user@")) { throw "ci.smoke does not resolve to the human: $resolved" }
            # without session markers under a process named claude it must refuse
            Copy-Item "$env:SystemRoot\System32\cmd.exe" "$tmp\claude.exe"
            # separate arguments: cmd /c takes the rest of its command line as is
            $out = "$(& "$tmp\claude.exe" /d /c $bin whoami 2>&1)"
            if ($LASTEXITCODE -eq 0) { throw "whoami succeeded under claude: $out" }
            if (-not $out.Contains('no session markers, but this process runs under a claude agent')) { throw "unexpected output: $out" }
            Write-Host "refused as expected: $out"
            $ok = $true
            # the expected refusal's exit status must not become the step's
            $global:LASTEXITCODE = 0
          } finally {
            if (-not $ok) {
              Write-Host "--- daemon log ($tmp\daemon.log)"
              Get-Content "$tmp\daemon.log" -ErrorAction SilentlyContinue
            }
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: conde-windows-x86_64
          path: out/
          if-no-files-found: error

  publish:
    needs: [web, macos, linux, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: conde-*
          merge-multiple: true
          path: out
      - name: Assemble
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' crates/conde/Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match crates/conde version $version" >&2
            exit 1
          fi
          cp dist/install.sh out/install.sh
          cp dist/install.ps1 out/install.ps1
          echo "$version" > out/latest
          (cd out && sha256sum -c ./*.sha256)
          # the integrity contract install.sh checks: one line per published file
          sums=$(cd out && find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -exec basename {} \; | sort | xargs sha256sum)
          printf '%s\n' "$sums" > out/SHA256SUMS
          cat out/SHA256SUMS
          ls -l out
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload to the dist container
        run: |
          az storage blob upload-batch --auth-mode login --account-name stconde -d dist -s out --overwrite
          # `irm | iex` reads it as text; a guessed binary type is not relied on
          az storage blob upload --auth-mode login --account-name stconde -c dist -n install.ps1 -f out/install.ps1 \
            --content-type "text/plain; charset=utf-8" --overwrite
