# Values of the conde-workspace chart for https://demo.conde.cloud; signs in against its Keycloak realm.
name: demo
hostname: demo.conde.cloud
boardName: demo
oidc:
  issuer: https://auth.conde.cloud/realms/demo
  clientId: conde
gcp:
  serviceAccount: conde-demo@conde-prod.iam.gserviceaccount.com
  secrets:
    adminKey: demo-admin-key
    oidcClientSecret: demo-oidc-client-secret
    slackBotToken: demo-slack-bot-token
