name: release

# On a v* tag: the Linux and macOS binaries with a SHA256SUMS file to the public dist bucket under
# v<version>/, the server image to Artifact Registry, and (DEPLOY_ENABLED) the image digest committed to
# deploy/image.yaml on main for Argo CD. Manual dispatch from a branch builds and tests only, unless
# AZURE_DEPLOY_ENABLED publishes to the legacy Azure dist container.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.98.0"
  CARGO_TERM_COLOR: never
  DIST_BUCKET: conde-cloud-dist
  IMAGE: europe-west3-docker.pkg.dev/conde-prod/conde/conde

jobs:
  # One build id for every binary: the released commit and the build date, which
  # `conde --version` prints as `conde 0.1.0 (<commit> <date>)`. A tag must name the crate's version.
  build-id:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.id.outputs.commit }}
      date: ${{ steps.id.outputs.date }}
      version: ${{ steps.id.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: id
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/conde/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match crates/conde version v$version" >&2
            exit 1
          fi
          {
            echo "commit=${GITHUB_SHA::7}"
            echo "date=$(date -u +%F)"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  # The web app the server image embeds (the Dockerfile builds it the same way): type check,
  # build, and the static files as an artifact.
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conde-web
          path: crates/conde-remote/web-dist/
          if-no-files-found: error

  macos:
    runs-on: macos-15
    needs: build-id
    env:
      CONDE_BUILD_COMMIT: ${{ needs.build-id.outputs.commit }}
      CONDE_BUILD_DATE: ${{ needs.build-id.outputs.date }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: conde-darwin-arm64
          - target: x86_64-apple-darwin
            name: conde-darwin-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: Build
        run: cargo build --release --locked -p conde --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/conde out/${{ matrix.name }}
          file out/${{ matrix.name }}
          (cd out && shasum -a 256 ${{ matrix.name }} > ${{ matrix.name }}.sha256)
      - name: Smoke test (native target only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          v=$(out/${{ matrix.name }} --version)
          echo "$v"
          case $v in *" ($CONDE_BUILD_COMMIT $CONDE_BUILD_DATE)") ;; *) echo "not this build's id"; exit 1 ;; esac
      - name: Identity probe (libproc ancestry walk, native target only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -eu
          bin="$PWD/out/${{ matrix.name }}"
          tmp=$(mktemp -d)
          export CONDE_SOCK="$tmp/run/conde.sock" CONDE_DATA="$tmp/data"
          "$bin" daemon >"$tmp/daemon.log" 2>&1 &
          daemon=$!
          dump() {
            rc=$?
            set +e
            if [ "$rc" != 0 ]; then
              echo "--- daemon log ($tmp/daemon.log)"
              cat "$tmp/daemon.log"
              if kill -0 "$daemon" 2>/dev/null; then
                echo "--- daemon still running"
              else
                wait "$daemon"
                echo "--- daemon exit status: $?"
              fi
            fi
            kill "$daemon" 2>/dev/null
            exit "$rc"
          }
          trap dump EXIT
          for _ in $(seq 1 100); do [ -S "$CONDE_SOCK" ] && break; sleep 0.1; done
          echo "--- conde doctor"
          "$bin" doctor || echo "--- doctor exit status: $?"
          user=$(printf '%s' "$USER" | tr '[:upper:]' '[:lower:]')
          # a bare runner: the walk finds no harness, so this shell acts as the human
          "$bin" register ci.smoke
          test "$("$bin" whoami | head -1 | cut -d" " -f1)" = "$user/ci.smoke"
          case $("$bin" resolve ci.smoke) in
            "human:$user@"*) ;;
            *) echo "ci.smoke does not resolve to the human"; exit 1 ;;
          esac
          # without session markers under a process named claude it must refuse;
          # /bin/sh on macOS execs another shell and would lose the name, so copy bash
          cp /bin/bash "$tmp/claude"
          # shellcheck disable=SC2016 # the inner shell expands $0 and $?
          if out=$("$tmp/claude" -c '"$0" whoami; rc=$?; exit $rc' "$bin" 2>&1); then
            echo "whoami succeeded under claude: $out"
            exit 1
          fi
          case $out in
            *"no session markers, but this process runs under a claude agent"*) echo "refused as expected: $out" ;;
            *) echo "unexpected output: $out"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    needs: build-id
    env:
      CONDE_BUILD_COMMIT: ${{ needs.build-id.outputs.commit }}
      CONDE_BUILD_DATE: ${{ needs.build-id.outputs.date }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            name: conde-linux-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_TOOLCHAIN"
      - name: cargo-zigbuild
        # zig cross-compiles the bundled SQLite C code for the musl target
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install cargo-zigbuild==0.23.4 ziglang==0.17.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo zigbuild --release --locked -p conde --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/conde out/${{ matrix.name }}
          file out/${{ matrix.name }}
          (cd out && sha256sum ${{ matrix.name }} > ${{ matrix.name }}.sha256)
      - name: Smoke test (native target only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          v=$(out/${{ matrix.name }} --version)
          echo "$v"
          case $v in *" ($CONDE_BUILD_COMMIT $CONDE_BUILD_DATE)") ;; *) echo "not this build's id"; exit 1 ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # The binaries to gs://conde-cloud-dist/v<version>/ with their SHA256SUMS, then `latest` and install.sh.
  publish:
    if: github.ref_type == 'tag'
    needs: [build-id, web, macos, linux]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.build-id.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the binary artifacts only: conde-web is the server image's, never a release file
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conde-*-*
          merge-multiple: true
          path: out
      - name: Assemble
        run: |
          bins="conde-darwin-arm64 conde-darwin-x86_64 conde-linux-x86_64"
          expected=$(for b in $bins; do printf '%s\n%s.sha256\n' "$b" "$b"; done | sort)
          actual=$(cd out && find . -mindepth 1 | sed 's|^\./||' | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'out/ holds:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          fi
          (cd out && sha256sum -c ./*.sha256 && rm ./*.sha256)
          # shellcheck disable=SC2086 # the list splits on purpose
          (cd out && sha256sum $bins > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Upload to the dist bucket
        run: |
          dest="gs://$DIST_BUCKET/v$VERSION"
          # a published version is immutable: an installer may already have checked its SHA256SUMS
          if gcloud storage objects describe "$dest/SHA256SUMS" >/dev/null 2>&1; then
            echo "v$VERSION is already published at $dest" >&2
            exit 1
          fi
          gcloud storage cp out/conde-* "$dest/"
          gcloud storage cp out/SHA256SUMS "$dest/SHA256SUMS"
          echo "v$VERSION" > out/latest
          gcloud storage cp --cache-control=no-store --content-type="text/plain; charset=utf-8" out/latest "gs://$DIST_BUCKET/latest"
          gcloud storage cp --cache-control=no-store --content-type="text/plain; charset=utf-8" dist/install.sh "gs://$DIST_BUCKET/install.sh"

  # The server image for linux/amd64, tagged with the version and the moving `gcp` tag.
  image:
    if: github.ref_type == 'tag'
    needs: [build-id, web, macos, linux]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          token_format: access_token
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: europe-west3-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.build-id.outputs.version }}
            ${{ env.IMAGE }}:gcp
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Argo CD rolls out what deploy/image.yaml on main names; this job is the only writer.
  promote:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: [build-id, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build-id.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Commit deploy/image.yaml to main
        run: |
          case $DIGEST in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "no image digest: '$DIGEST'" >&2; exit 1 ;; esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          write() {
            mkdir -p deploy
            {
              echo "# The conde server image every workspace runs; the release workflow writes this file. With a digest the image is"
              echo "# repository@digest; the tag only names the build."
              printf 'image:\n  repository: %s\n  tag: "%s"\n  digest: "%s"\n' "$IMAGE" "$VERSION" "$DIGEST"
            } > deploy/image.yaml
            git add deploy/image.yaml
            git diff --cached --quiet || git commit -m "release: $VERSION"
          }
          # main may move between checkout and push: start again from the new tip
          for _ in 1 2 3; do
            write
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1

  # Legacy: the Azure dist container behind https://conde.nativeai.space/dist, until the cutover. It keeps
  # its own install.sh and install.ps1 (the flat layout); dist/install.sh is the GCP bucket's now.
  publish-azure:
    if: vars.AZURE_DEPLOY_ENABLED == 'true'
    needs: [web, macos, linux]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: conde-*-*
          merge-multiple: true
          path: out
      - name: Assemble
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' crates/conde/Cargo.toml | head -n 1)"
          cp dist/install.ps1 out/install.ps1
          echo "$version" > out/latest
          (cd out && sha256sum -c ./*.sha256)
          sums=$(cd out && find . -maxdepth 1 -type f ! -name '*.sha256' ! -name SHA256SUMS -exec basename {} \; | sort | xargs sha256sum)
          printf '%s\n' "$sums" > out/SHA256SUMS
          cat out/SHA256SUMS
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload to the dist container
        run: |
          az storage blob upload-batch --auth-mode login --account-name stconde -d dist -s out --overwrite
          # `irm | iex` reads it as text; a guessed binary type is not relied on
          az storage blob upload --auth-mode login --account-name stconde -c dist -n install.ps1 -f out/install.ps1 \
            --content-type "text/plain; charset=utf-8" --overwrite
