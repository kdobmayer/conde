{{- /* With one replica a PDB of minAvailable 1 only delays the eviction. */}}
{{- if gt (int .Values.replicas) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: conde
  namespace: {{ .Release.Namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "conde.labels" . | nindent 6 }}
{{- end }}
