# Workspace name: the object labels, the default board name and database name.
name: ""
# Public hostname the server answers on; the OIDC redirect is https://<hostname>/auth/callback.
hostname: ""
# Board name shown to users; defaults to name.
boardName: ""
replicas: 2

image:
  repository: europe-west3-docker.pkg.dev/conde-prod/conde/conde
  tag: gcp
  # When set, the image is repository@digest and the tag is ignored.
  digest: ""
  pullPolicy: ""

oidc:
  issuer: ""
  clientId: conde
  # Defaults to https://<hostname>/auth/callback.
  redirectUri: ""

# How the admin API's invites reach the invited person (CONDE_JOIN_SIGN_IN): google, microsoft or sso, one email the
# server sends through Resend; password, Keycloak's account-setup email; empty, no email.
invite:
  signIn: ""
  # sso: the account the email tells the person to sign in with, "your <account> account" (CONDE_JOIN_ACCOUNT;
  # empty, the server's default "company").
  account: ""
  # Password workspaces: the Keycloak admin API at its in-cluster address (the public host blocks /admin), with
  # the network policy egress to that namespace.
  keycloakAdmin:
    url: http://keycloak.keycloak.svc.cluster.local:8080
    clientId: conde-admin
    namespace: keycloak

logLevel: info
distBaseUrl: https://storage.googleapis.com/conde-cloud-dist
# Extra container env entries, appended after the chart's own.
extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
    ephemeral-storage: 1Gi
  limits:
    ephemeral-storage: 1Gi

# Long-lived SSE and WebSocket streams get time to close and reconnect elsewhere.
terminationGracePeriodSeconds: 600
# Seconds a terminating pod keeps serving before SIGTERM, while the load balancer drops it (measured on GKE: 503s for
# 18 s after a SIGTERM without it); counts toward the grace period. 0 turns it off.
preStopSleepSeconds: 30

# GKE Autopilot adds this toleration at admission; stating it keeps diffs empty. Empty list elsewhere.
tolerations:
  - key: kubernetes.io/arch
    operator: Equal
    value: amd64
    effect: NoSchedule

# Create the namespace object (with the Gateway's selector label). Leave false with `helm install --create-namespace`.
namespace:
  create: false
  labels:
    conde.cloud/gateway: shared

# Gateway API route to the Service.
route:
  enabled: true
  gateway:
    name: conde
    namespace: gateway
    sectionName: https

networkPolicy:
  enabled: true
  # Sources allowed to reach port 8080; the defaults are the Google load balancer and health-check ranges.
  ingressCidrs:
    - 35.191.0.0/16
    - 130.211.0.0/22
  # Egress besides kube-dns: a list of {cidr, except: [], ports: [{protocol, port}]}.
  egress: []
  # Port 443 to any public address: the reach before the hostname policy, kept to put back for one workspace.
  publicHttps: false
  # GKE FQDNNetworkPolicy (the cluster's FQDN network policy feature): port 443 to slack.com, the issuer's host,
  # api.resend.com when invite.signIn is google, microsoft or sso, *.googleapis.com with gcp.enabled, and extraHosts.
  fqdn:
    enabled: false
    extraHosts: []

# Portable secrets (gcp.enabled false): the container env comes from one Secret holding DATABASE_URL,
# CONDE_ADMIN_KEY, OIDC_CLIENT_SECRET and optionally CONDE_SLACK_BOT_TOKEN, RESEND_API_KEY and
# KEYCLOAK_ADMIN_CLIENT_SECRET.
existingSecret: ""
# Or let External Secrets Operator create that Secret (named <release>-env) from a store.
externalSecret:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  # Env name to remote key, for example DATABASE_URL: conde/demo/database-url.
  data: {}

# GKE: Cloud SQL Auth Proxy sidecar with IAM authentication, Secret Manager CSI files, GKE load balancer policies,
# and the dbinit Job that hands the database to the workspace's IAM user.
gcp:
  enabled: false
  project: ""
  # The workspace's Google service account (Workload Identity, IAM database user).
  serviceAccount: ""
  sqlConnectionName: ""
  cloudSqlProxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.3@sha256:f333a9c59890c3c67b8505166c5dbdcc0b29fca9173a2e09ca0446ab6997a736
  # Database name; defaults to conde_<name>.
  database: ""
  # Secret Manager secret ids, mounted as files under /secrets.
  secrets:
    adminKey: ""
    oidcClientSecret: ""
    slackBotToken: ""
    # The Resend API key the invite email is sent with; empty mounts none.
    resendApiKey: ""
    # The Keycloak admin client's secret; required when invite.signIn is password.
    keycloakAdminClientSecret: ""
  # Cloud Armor policy attached to the backend.
  securityPolicy: ""
  backendTimeoutSec: 3600
  dbinit:
    enabled: true
    image: docker.io/library/postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    # Secret Manager secret holding the Cloud SQL `postgres` password.
    adminSecret: pg-admin-password
