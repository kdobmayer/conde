# https://vvpusa.conde.cloud, signing in against its Keycloak realm, which brokers VVP USA's AWS IAM Identity Center
# (infra/gcp/realms/saml.tf). The file name is the workspace name; everything else the chart needs is derived from it
# in deploy/argocd/workspaces.yaml.tftpl, and only these keys (boardName, displayName, oidc, invite, and optionally
# replicas) are read from here.
boardName: vvpusa
# The workspace's name in the invite email.
displayName: VVP USA
oidc:
  issuer: https://auth.conde.cloud/realms/vvpusa
  clientId: conde
# How an invite reaches the person: one email from the server naming the account to sign in with (docs/DEPLOY.md,
# invites).
invite:
  signIn: sso
  account: VVP USA
# One server: a restart or node drain is a short outage, accepted for the cost.
replicas: 1
