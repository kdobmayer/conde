[package]
name = "conde-remote"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json", "query", "form"] }
axum-extra = { version = "0.12.6", default-features = false, features = ["cookie"] }
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }
base64 = "0.23.1"
futures-util = "0.3.34"
governor = { version = "=0.10.4", default-features = false, features = ["std", "dashmap"] }
openidconnect = { version = "=4.0.1", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "query"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
tracing = "0.1.44"
webpki-roots = "1.0.9"

[dev-dependencies]
serde_path_to_error = "0.1.20"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "cookies", "json", "form"] }
rsa = { version = "0.9.10", features = ["sha2"] }
rand_core06 = { package = "rand_core", version = "0.6.4", features = ["getrandom"] }
tokio = { version = "1.53.2", features = ["io-util", "macros", "rt-multi-thread"] }
