name: site

# The public site at https://conde.cloud (site/, Astro + Starlight; /install.sh is dist/install.sh):
# built with Node 22 and deployed to the Cloudflare Pages project conde-cloud on every push to main
# that touches it. Manual dispatch builds and deploys the same way.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "dist/install.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # CLOUDFLARE_API_TOKEN: a repository secret, a token scoped to Cloudflare Pages edits only.
      # CLOUDFLARE_ACCOUNT_ID: a repository variable.
      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name conde-cloud
