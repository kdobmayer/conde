<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<!-- The theme before the first paint (lib/theme.ts); its copy in pages.rs must match. -->
		<script>(function(){var r=document.documentElement,m=matchMedia('(prefers-color-scheme: light)');function a(){var t=null;try{t=localStorage.getItem('conde.theme')}catch(e){}r.dataset.theme=t==='light'||t==='dark'?t:m.matches?'light':'dark'}a();m.addEventListener('change',a);addEventListener('storage',a)})()</script>
		<title>conde</title>
		<link rel="icon" href="/app/favicon-light-32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: light)" />
		<link rel="icon" href="/app/favicon-dark-32.png" sizes="32x32" type="image/png" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="/app/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
