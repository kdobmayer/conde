[package]
name = "conde-transport"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
libc = "0.2.190"
serde_json = "1.0.151"
sha2 = "0.11.0"
socket2 = "0.6.5"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.27.0"

# changes the process environment: its one case runs on the main thread
[[test]]
name = "codex_fallback"
harness = false
